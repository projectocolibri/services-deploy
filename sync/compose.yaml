# ============================================================================
# Off-site sync (rclone)
#
# Purpose:       Copies Docker volumes and data folders of this server (the
#                backups, or any other) to off-site storage such as Google
#                Drive, on a schedule.
# Role:          One container per server that has something to copy.
#                sync.sh copies each entry of SYNC_VOLUMES (a volume, or a
#                folder inside SYNC_DATA_DIR) to SYNC_DESTINATION/<name> with
#                `rclone copy`:
#                  - never deletes anything on the destination: files removed
#                    here stay there
#                  - files changed here are uploaded again; the previous
#                    version is kept in SYNC_DESTINATION/_versions/<date>/
#                  - SYNC_MAX_AGE (optional) then deletes files older than
#                    that from the destination, so it does not grow forever
#                  - SYNC_ENCRYPT_PASSWORD (recommended) encrypts contents and
#                    file names on the destination (rclone crypt)
#                Runs once at start, then on SYNC_SCHEDULE. Also:
#                  docker compose run --rm sync config     set up the remote
#                  docker compose run --rm sync run        copy now
#                  docker compose run --rm -v <volume>:/restore sync restore <name>
#                                                          bring a copy back
# Prerequisites: - An rclone remote in ./rclone/rclone.conf (sync config), or
#                  a destination that needs none (e.g. /mnt/x, :sftp,...)
#                - Read access to Docker's volume directory (Linux:
#                  /var/lib/docker/volumes; also works on Docker Desktop)
#                - Data kept in folders (see the *_DATA_VOLUME and
#                  *_BACKUP_VOLUME variables): their common parent folder in
#                  SYNC_DATA_DIR
# Variables:     PROJECT_NAME, TZ, SYNC_DESTINATION, SYNC_VOLUMES,
#                SYNC_SCHEDULE, SYNC_MAX_AGE, SYNC_ENCRYPT_PASSWORD,
#                SYNC_ENCRYPT_SALT, SYNC_RCLONE_FLAGS, SYNC_DOCKER_VOLUMES_DIR,
#                SYNC_DATA_DIR.
# ============================================================================

services:
  sync:
    # --------------------------------------------------------------------------
    # Image and restart policy
    # --------------------------------------------------------------------------
    # rclone plus supercronic (./Dockerfile). Runs as root to read every
    # volume (backup files are readable only by their owner).
    build:
      context: .
    restart: always
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [sync]
    user: root

    # --------------------------------------------------------------------------
    # Sync settings
    # --------------------------------------------------------------------------
    environment:
      # TZ: time zone of SYNC_SCHEDULE and the log timestamps.
      TZ: ${TZ}
      # PROJECT_NAME: prefix Compose adds to volume names; SYNC_VOLUMES may
      # leave it out.
      PROJECT_NAME: ${PROJECT_NAME}
      # SYNC_DESTINATION: rclone remote and folder of this server.
      SYNC_DESTINATION: ${SYNC_DESTINATION}
      # SYNC_VOLUMES: volumes and folders to copy.
      SYNC_VOLUMES: ${SYNC_VOLUMES}
      # SYNC_DATA_DIR: host folder mounted at /data, to recognize full paths
      # in SYNC_VOLUMES.
      SYNC_DATA_DIR: ${SYNC_DATA_DIR:-}
      # SYNC_SCHEDULE: cron expression of the copies.
      SYNC_SCHEDULE: ${SYNC_SCHEDULE}
      # SYNC_MAX_AGE: delete files older than this from the destination.
      SYNC_MAX_AGE: ${SYNC_MAX_AGE}
      # SYNC_ENCRYPT_PASSWORD / SYNC_ENCRYPT_SALT: rclone crypt passwords.
      SYNC_ENCRYPT_PASSWORD: ${SYNC_ENCRYPT_PASSWORD}
      SYNC_ENCRYPT_SALT: ${SYNC_ENCRYPT_SALT}
      # SYNC_RCLONE_FLAGS: extra rclone flags (e.g. --bwlimit 10M).
      SYNC_RCLONE_FLAGS: ${SYNC_RCLONE_FLAGS}
      # RCLONE_CONFIG: rclone's configuration file (./rclone).
      RCLONE_CONFIG: /config/rclone/rclone.conf

    # --------------------------------------------------------------------------
    # Startup
    # --------------------------------------------------------------------------
    entrypoint: ["/bin/bash", "/usr/local/bin/sync.sh"]

    # --------------------------------------------------------------------------
    # Volumes and configuration
    # --------------------------------------------------------------------------
    volumes:
      # Every Docker volume on this server, read-only: the copy never changes
      # them. SYNC_DOCKER_VOLUMES_DIR: Docker's volume directory.
      - ${SYNC_DOCKER_VOLUMES_DIR}:/volumes:ro
      # Folder holding the data folders set as paths in .env, read-only.
      # SYNC_DATA_DIR empty: an empty ./data folder next to this file.
      - ${SYNC_DATA_DIR:-./data}:/data:ro
      # rclone configuration (remotes and their tokens), written by
      # `sync config` and updated by rclone when a token is refreshed.
      - ./rclone:/config/rclone
      # Copy, schedule, restore and health check script.
      - ./sync.sh:/usr/local/bin/sync.sh:ro

    # --------------------------------------------------------------------------
    # Health check
    # --------------------------------------------------------------------------
    # Healthy while the last copy succeeded.
    healthcheck:
      test: ["CMD", "/bin/bash", "/usr/local/bin/sync.sh", "health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 6h
