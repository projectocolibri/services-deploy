# ============================================================================
# Root Compose file
#
# Purpose:       Single entry point for the whole deployment. It defines no
#                services of its own: it includes the gateway, monitoring and
#                database stacks and declares the network they all share.
# Role:          `docker compose up -d` from this directory starts the services
#                of the server roles in COMPOSE_PROFILES (.env), as one
#                Compose project. Every server uses these same files.
# Prerequisites: - Docker Engine with Docker Compose v2.24 or later (for
#                  `include`)
#                - A .env file next to this one: copy .env.example to .env and
#                  edit it. Compose loads it automatically; it is the only
#                  settings file of the deployment.
# Variables:     COMPOSE_PROFILES, PROJECT_NAME, NETWORK_NAME, NETWORK_SUBNET
#                from .env. Every other variable in .env reaches the included
#                stacks (see .env.example for the meaning of each one).
# ============================================================================

# ----------------------------------------------------------------------------
# Project name
# ----------------------------------------------------------------------------
# PROJECT_NAME: prefix for every container, volume and default resource name.
name: ${PROJECT_NAME}

# ----------------------------------------------------------------------------
# Included stacks
# ----------------------------------------------------------------------------
# Each entry is a stack directory with its own compose.yaml. All stacks are
# always included; COMPOSE_PROFILES decides which services run. No stack
# depends on another: services wait for their dependencies by themselves.
include:
  # Gateway: WireGuard VPN (private access) and nginx (public web apps).
  - path: ./gateway/compose.yaml

  # Monitoring: PMM Server, PMM client with cAdvisor, Dozzle for logs and
  # Portainer for container management.
  - path: ./monitoring/compose.yaml

  # MySQL: Percona Server primary, read-only replica and phpMyAdmin.
  - path: ./databases/mysql/compose.yaml

  # PostgreSQL: Percona Distribution primary, read-only replica and pgAdmin.
  - path: ./databases/postgres/compose.yaml

  # Apps: Java service and Angular SSR app examples. No variables:
  # settings are fixed in each app's Dockerfile.
  - path: ./apps/compose.yaml

# ----------------------------------------------------------------------------
# Shared internal network
# ----------------------------------------------------------------------------
# Every service joins `default`, so containers reach each other by service
# name and by network alias (mysql-primary, postgres-replica, ...).
networks:
  default:
    # NETWORK_NAME: fixed network name (not prefixed with the project name).
    name: ${NETWORK_NAME}
    ipam:
      config:
        # NETWORK_SUBNET: fixed subnet, routed through the VPN by clients
        # (VPN_ALLOWED_IPS in .env is built from it).
        - subnet: ${NETWORK_SUBNET}
