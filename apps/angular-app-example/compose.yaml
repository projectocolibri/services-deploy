# ============================================================================
# Angular app example (server-side rendering)
#
# Purpose:       Runs the Angular SSR build in ./source with Node.js.
# Role:          Internal service on ANGULAR_APP_EXAMPLE_PORT: published
#                through the HTTP gateway (gateway/http/conf.d/<app>.conf with
#                proxy_pass http://angular-app-example:<port>), or reached
#                through the VPN at http://angular-app-example:<port>.
#                To deploy a new version, replace the files and run
#                `docker compose up -d --build angular-app-example`.
# Prerequisites: - ./source: content of dist/<app>/ from `ng build` (not
#                  committed)
# Variables:     TZ and ANGULAR_APP_EXAMPLE_* from .env.
# ============================================================================

services:
  angular-app-example:
    # --------------------------------------------------------------------------
    # Image and restart policy
    # --------------------------------------------------------------------------
    build:
      context: .
    restart: always
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [angular-app-example]
    # tini as PID 1: forwards stop signals to node.
    init: true

    # --------------------------------------------------------------------------
    # HTTP port
    # --------------------------------------------------------------------------
    # Port the SSR server listens on (PORT below), from .env. Exposed to the
    # internal network only, not published on the host: the HTTP gateway
    # reaches it at http://angular-app-example:<port>.
    expose:
      - "${ANGULAR_APP_EXAMPLE_PORT}"

    # --------------------------------------------------------------------------
    # Environment
    # --------------------------------------------------------------------------
    environment:
      # TZ: time zone of the server (logs, dates rendered on the server), from
      # .env.
      TZ: ${TZ}
      # Server, from .env.
      #   NODE_ENV                mode of Express and Angular
      #   PORT                    port the SSR server listens on (same value
      #                           as expose above)
      #   NG_ALLOWED_HOSTS        host names Angular renders for; other hosts
      #                           get 400 Bad Request. * allows any host and
      #                           leaves access control to the HTTP gateway
      #   NG_TRUST_PROXY_HEADERS  proxy headers trusted from the HTTP gateway,
      #                           so pages know they are served over HTTPS
      NODE_ENV: ${ANGULAR_APP_EXAMPLE_NODE_ENV}
      PORT: ${ANGULAR_APP_EXAMPLE_PORT}
      NG_ALLOWED_HOSTS: ${ANGULAR_APP_EXAMPLE_ALLOWED_HOSTS}
      NG_TRUST_PROXY_HEADERS: ${ANGULAR_APP_EXAMPLE_TRUST_PROXY_HEADERS}
