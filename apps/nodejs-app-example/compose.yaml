# ============================================================================
# Node.js app example
#
# Purpose:       Runs the Node.js application in ./source.
# Role:          Internal service on port 8080: published through the HTTP
#                gateway (gateway/http/conf.d/<app>.conf with
#                proxy_pass http://nodejs-app-example:8080), or reached
#                through the VPN at http://nodejs-app-example:8080.
#                To deploy a new version, replace the files and run
#                `docker compose up -d --build nodejs-app-example`.
# Prerequisites: - ./source: the app with package.json and package-lock.json
#                  (not committed); dependencies are installed in the image
#                - The app listens on process.env.PORT, on all interfaces
# Variables:     TZ, NODEJS_APP_EXAMPLE_NODE_ENV and NODEJS_APP_EXAMPLE_PORT
#                from .env.
# ============================================================================

services:
  nodejs-app-example:
    # --------------------------------------------------------------------------
    # Image and restart policy
    # --------------------------------------------------------------------------
    build:
      context: .
    restart: always
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [nodejs-app-example]
    # tini as PID 1: forwards stop signals to node.
    init: true

    # --------------------------------------------------------------------------
    # HTTP port
    # --------------------------------------------------------------------------
    # Port the app listens on (PORT below), from .env. Exposed to the
    # internal network only, not published on the host: the HTTP gateway
    # reaches it at http://nodejs-app-example:<port>.
    expose:
      - "${NODEJS_APP_EXAMPLE_PORT}"

    # --------------------------------------------------------------------------
    # Environment
    # --------------------------------------------------------------------------
    environment:
      # TZ: time zone of the app (logs, dates), from .env.
      TZ: ${TZ}
      # Server.
      #   NODE_ENV  mode of the app and its libraries (Express, etc.), from
      #             .env
      #   PORT      port the app listens on, from .env (same value as
      #             expose above)
      NODE_ENV: ${NODEJS_APP_EXAMPLE_NODE_ENV}
      PORT: ${NODEJS_APP_EXAMPLE_PORT}
