# ============================================================================
# Apps stack
#
# Purpose:       Groups the company's applications.
# Role:          One folder per app, each with its export in source/, a
#                Dockerfile that copies it into the image with fixed settings
#                and a compose.yaml:
#                - java-service-example: Java application exported for
#                  Linux, run with its own JRE
#                - angular-app-example: Angular SSR build, run by Node.js
#                New app: copy the example folder of the same type to
#                apps/<app>, rename the service (and the Java launcher), and
#                include it below.
#                Each app runs only when COMPOSE_PROFILES (root .env) includes
#                apps (every app) or its service name.
# Prerequisites: - The export in each app's source/ (not committed)
#                - The Linux JRE in java-service-example/jre/ (not committed)
# Variables:     None: settings are fixed in each app's Dockerfile. TZ comes
#                from the root .env.dev.
# ============================================================================

include:
  # --------------------------------------------------------------------------
  # Java service (Linux export + JRE)
  # --------------------------------------------------------------------------
  - path: ./java-service-example/compose.yaml

  # --------------------------------------------------------------------------
  # Angular app (SSR build run by Node.js)
  # --------------------------------------------------------------------------
  - path: ./angular-app-example/compose.yaml
