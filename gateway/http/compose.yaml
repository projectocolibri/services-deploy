services:
  http:
    image: nginx:1.28-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # one config per app (see conf.d/app.conf.example)
      - ./conf.d:/etc/nginx/conf.d:ro
      # certificates: certs/<name>/fullchain.pem + privkey.pem (not committed)
      - ./certs:/etc/nginx/certs:ro
