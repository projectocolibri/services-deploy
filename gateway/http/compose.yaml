# ============================================================================
# HTTP gateway (nginx)
#
# Purpose:       Reverse proxy that publishes internal web apps to the
#                internet over HTTPS.
# Role:          Public entry point for web traffic. TLS ends here; requests
#                are forwarded over plain HTTP to app containers on the
#                internal network. Hosts without a config are refused.
# Prerequisites: - TCP ports HTTP_PORT and HTTPS_PORT open in the firewall
#                - Copy conf.d/sites.conf.example to sites.conf, remove
#                  default.conf, and customize the public and internal sites.
#                - Certificates in ${HTTP_CERTS_VOLUME}/<domain>/ as configured
#                  by the active nginx site configuration.
# Variables:     HTTP_PORT, HTTPS_PORT, HTTP_CERTS_VOLUME and TZ from .env.
# ============================================================================

services:
  http:
    # --------------------------------------------------------------------------
    # Image and restart policy
    # --------------------------------------------------------------------------
    image: nginx:1.28-alpine
    restart: always
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [http]

    # --------------------------------------------------------------------------
    # Time zone
    # --------------------------------------------------------------------------
    environment:
      # TZ: time zone of access and error log timestamps, from .env.
      TZ: ${TZ}

    # --------------------------------------------------------------------------
    # Published ports
    # --------------------------------------------------------------------------
    ports:
      # HTTP_PORT: host port for plain HTTP (redirects to HTTPS).
      - "${HTTP_PORT}:80"
      # HTTPS_PORT: host port for HTTPS.
      - "${HTTPS_PORT}:443"

    # --------------------------------------------------------------------------
    # Configuration and certificates (read-only)
    # --------------------------------------------------------------------------
    volumes:
      # Site configs. Only *.conf files are loaded. Reload after changes:
      #   docker compose exec http nginx -s reload
      - ./conf.d:/etc/nginx/conf.d:ro
      # TLS certificates from the host path configured in .env (read-only).
      - ${HTTP_CERTS_VOLUME:?Set HTTP_CERTS_VOLUME to the host certificate directory}:/etc/nginx/certs:ro
