# ============================================================================
# Default servers: requests for hosts without their own config are refused.
# Apps get their own file in this folder (see app.conf.example).
# ============================================================================

server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
