# ============================================================================
# nginx default servers
#
# Purpose:       Catch-all servers for requests whose Host header matches no
#                app config.
# Role:          Refuses unknown hosts, scans hitting the IP address directly
#                and HTTPS handshakes for domains without a certificate, so
#                only explicitly configured apps are reachable.
# Prerequisites: None. Each app gets its own file in this directory
#                (see app.conf.example).
# Variables:     None (server_name _ is a placeholder that matches nothing).
# ============================================================================

# ----------------------------------------------------------------------------
# Global HTTP settings
# ----------------------------------------------------------------------------
# Hide the nginx version in error pages and the Server header.
server_tokens off;

# ----------------------------------------------------------------------------
# Default HTTP server (port 80)
# ----------------------------------------------------------------------------
# Handles any plain HTTP request for an unknown host.
server {
    listen 80 default_server;
    server_name _;
    # 444: close the connection without sending a response.
    return 444;
}

# ----------------------------------------------------------------------------
# Default HTTPS server (port 443)
# ----------------------------------------------------------------------------
# Handles any TLS connection for an unknown host (SNI).
server {
    listen 443 ssl default_server;
    server_name _;
    # Abort the TLS handshake, so no certificate is needed for this server.
    ssl_reject_handshake on;
}
