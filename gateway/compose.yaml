# ============================================================================
# Gateway stack
#
# Purpose:       Groups the only two entry points into the deployment.
# Role:          - VPN  (./vpn):  private access to every internal service
#                                 (databases, admin panels, monitoring)
#                - HTTP (./http): public web apps behind nginx, TLS ends here
# Prerequisites: - gateway/.env must exist (may be empty)
#                - Firewall open for the VPN (UDP) and HTTP/HTTPS (TCP) ports
# Variables:     Loaded from the env files below. See gateway/.env.dev for the
#                meaning and defaults of each variable.
# ============================================================================

include:
  # --------------------------------------------------------------------------
  # VPN gateway (WireGuard)
  # --------------------------------------------------------------------------
  # Env files are layered in order; a key in ./.env overrides ./.env.dev.
  - path: ./vpn/compose.yaml
    env_file:
      # Committed development defaults.
      - ./.env.dev
      # Local, uncommitted overrides and secrets.
      - ./.env

  # --------------------------------------------------------------------------
  # HTTP gateway (nginx reverse proxy)
  # --------------------------------------------------------------------------
  - path: ./http/compose.yaml
    env_file:
      # Committed development defaults.
      - ./.env.dev
      # Local, uncommitted overrides and secrets.
      - ./.env
