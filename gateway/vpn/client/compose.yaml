# ============================================================================
# VPN client (WireGuard peer)
#
# Purpose:       Connects this server to the VPN host running on another server,
#                so containers here reach that server's internal network
#                (e.g. a replica here following mysql-primary there).
# Role:          Brings up a WireGuard interface in the HOST network namespace.
#                Docker routes and NATs container traffic for the VPN's
#                AllowedIPs through it, so no container needs any change.
#                Stopping the service removes the interface and its routes.
#                Run it on every server except the one running ../host.
# Prerequisites: - Linux host with the WireGuard kernel module (kernel 5.6+)
#                - A peer for this server on the VPN host (add a name to
#                  VPN_PEERS there) and its peer_<name>.conf copied to
#                  gateway/vpn/client/config/peer.conf on this server
#                - This server's NETWORK_SUBNET different from the VPN host's
#                  (the client refuses to start on overlapping routes)
#                - Outbound UDP to the VPN host (no inbound port needed)
# Variables:     VPN_CLIENT_INTERFACE, VPN_CLIENT_KEEPALIVE,
#                VPN_CLIENT_ALLOWED_IPS and TZ from .env.
# ============================================================================

services:
  vpn-client:
    # --------------------------------------------------------------------------
    # Image and restart policy
    # --------------------------------------------------------------------------
    # Same image as the host, used only for its WireGuard tools: the custom
    # entrypoint replaces the image's init, whose client mode deletes the
    # default route when a tunnel fails (fatal on the host network).
    image: lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls122
    restart: always
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [vpn-client]

    # --------------------------------------------------------------------------
    # Host networking
    # --------------------------------------------------------------------------
    # The interface and routes are created on the host, so every container on
    # this server can use the tunnel. NET_ADMIN manages interfaces and routes.
    network_mode: host
    cap_add:
      - NET_ADMIN

    # --------------------------------------------------------------------------
    # Tunnel settings
    # --------------------------------------------------------------------------
    environment:
      # TZ: container time zone, from .env. Default: Etc/UTC.
      TZ: ${TZ:-Etc/UTC}
      # VPN_CLIENT_INTERFACE: name of the WireGuard interface on the host.
      # Default: wg-services.
      VPN_CLIENT_INTERFACE: ${VPN_CLIENT_INTERFACE:-wg-services}
      # VPN_CLIENT_KEEPALIVE: seconds between keepalive packets, keeps the
      # tunnel open through NAT and firewalls. Default: 25.
      VPN_CLIENT_KEEPALIVE: ${VPN_CLIENT_KEEPALIVE:-25}
      # VPN_CLIENT_ALLOWED_IPS: networks routed through the tunnel. Empty: use
      # AllowedIPs from peer.conf (the VPN host's VPN_ALLOWED_IPS).
      VPN_CLIENT_ALLOWED_IPS: ${VPN_CLIENT_ALLOWED_IPS:-}

    # --------------------------------------------------------------------------
    # Startup
    # --------------------------------------------------------------------------
    # Builds the tunnel config from peer.conf, checks for route conflicts and
    # brings the interface up; takes it down on stop.
    entrypoint: ["/bin/bash", "/usr/local/bin/vpn-client-entrypoint.sh"]

    # --------------------------------------------------------------------------
    # Configuration and scripts
    # --------------------------------------------------------------------------
    volumes:
      # peer.conf: the peer config generated by the VPN host (secret, not
      # committed).
      - ./config:/config:ro
      # Entrypoint script.
      - ./vpn-client-entrypoint.sh:/usr/local/bin/vpn-client-entrypoint.sh:ro

    # --------------------------------------------------------------------------
    # Health check
    # --------------------------------------------------------------------------
    # Healthy while the last handshake with the VPN host is under 3 minutes
    # old (handshakes renew every 2 minutes on an active tunnel).
    healthcheck:
      test: ["CMD", "/bin/bash", "/usr/local/bin/vpn-client-entrypoint.sh", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
