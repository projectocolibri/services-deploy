# ============================================================================
# WireGuard client (peer) config template
#
# Purpose:       Template the vpn container renders once per name in VPN_PEERS
#                into config/peer_NAME/peer_NAME.conf (plus a QR code).
# Role:          The file handed to each administrator and imported into the
#                WireGuard app to join the VPN.
# Prerequisites: Rendered by the linuxserver/wireguard image on start, after it
#                creates the peer keys. Existing client configs are only
#                regenerated when the peer list or server settings change.
#                This file is expanded by a shell, so these comments must not
#                contain dollar signs, backticks or backslashes.
#
# Template placeholders (filled in by the image when rendering):
#   CLIENT_IP   tunnel address assigned to this peer (.2, .3, ... of VPN_SUBNET)
#   PEER_ID     peer directory name, e.g. peer_admin
#   PEERDNS     DNS server clients use (the CoreDNS address inside the tunnel
#               when PEERDNS=auto)
#   SERVERURL   public address of the server (VPN_HOST)
#   SERVERPORT  public UDP port of the server (VPN_PORT)
#   ALLOWEDIPS  networks routed through the tunnel (VPN_ALLOWED_IPS)
#   the cat commands  read the keys the image generated for this peer and
#               the server
# ============================================================================

# ----------------------------------------------------------------------------
# Client interface
# ----------------------------------------------------------------------------
# Address:    tunnel IP of this client
# PrivateKey: this client's private key (config/PEER_ID/privatekey-PEER_ID)
# ListenPort: local UDP port the client binds to
# DNS:        resolver used while connected, so service names resolve
[Interface]
Address = ${CLIENT_IP}
PrivateKey = $(cat /config/${PEER_ID}/privatekey-${PEER_ID})
ListenPort = 51820
DNS = ${PEERDNS}

# ----------------------------------------------------------------------------
# Server peer
# ----------------------------------------------------------------------------
# PublicKey:    server public key, identifies the server
# PresharedKey: extra symmetric key shared by this client and the server
# Endpoint:     public address and port the client connects to
# AllowedIPs:   destinations sent through the tunnel (split tunnel)
[Peer]
PublicKey = $(cat /config/server/publickey-server)
PresharedKey = $(cat /config/${PEER_ID}/presharedkey-${PEER_ID})
Endpoint = ${SERVERURL}:${SERVERPORT}
AllowedIPs = ${ALLOWEDIPS}
