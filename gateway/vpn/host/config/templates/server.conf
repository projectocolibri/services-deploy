# ============================================================================
# WireGuard server config template
#
# Purpose:       Template the vpn container renders into
#                config/wg_confs/wg0.conf, the server side of the tunnel.
# Role:          Defines the server address, its private key and the firewall
#                rules that let VPN clients reach the internal Docker network.
# Prerequisites: Rendered by the linuxserver/wireguard image on start, which
#                creates the server keys under config/server/ first.
#                This file is expanded by a shell, so these comments must not
#                contain dollar signs, backticks or backslashes.
#
# Template placeholders (filled in by the image when rendering):
#   INTERFACE  first three octets of INTERNAL_SUBNET (VPN_SUBNET), e.g.
#              10.13.13; the server takes the .1 address
#   the cat command  reads the server private key generated by the image
#   %i         (wg-quick, not the image) name of the WireGuard interface, wg0
# ============================================================================

# ----------------------------------------------------------------------------
# Server interface
# ----------------------------------------------------------------------------
# Address:    tunnel IP of the server (first address of the VPN subnet)
# ListenPort: WireGuard port inside the container (published as VPN_PORT)
# PrivateKey: server private key, read from config/server/privatekey-server
# PostUp:     when the tunnel starts, allow forwarding to and from wg0 and
#             masquerade client traffic leaving through the Docker network
#             (eth+), so internal services see replies routed back correctly
# PostDown:   remove the same rules when the tunnel stops
[Interface]
Address = ${INTERFACE}.1
ListenPort = 51820
PrivateKey = $(cat /config/server/privatekey-server)
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth+ -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth+ -j MASQUERADE
