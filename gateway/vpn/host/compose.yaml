# ============================================================================
# VPN host (WireGuard server)
#
# Purpose:       Runs the WireGuard server that gives administrators and other
#                servers private access to this server's internal Docker
#                network.
# Role:          The only way to reach internal services (databases, admin
#                panels, PMM, Dozzle). Peers are people (WireGuard app) or other
#                servers running ../client. Peers resolve Docker service names
#                through the DNS server built into the container.
#                Run it on exactly one server: the one with the primaries.
# Prerequisites: - Linux host with the WireGuard kernel module (kernel 5.6+)
#                - UDP port VPN_PORT open in the firewall
#                - VPN_HOST set to this server's public IP or domain
# Variables:     VPN_HOST, VPN_PORT, VPN_PEERS, VPN_SUBNET, VPN_ALLOWED_IPS,
#                TZ and VPN_DNS_IP from .env.
# ============================================================================

services:
  vpn:
    # --------------------------------------------------------------------------
    # Image and restart policy
    # --------------------------------------------------------------------------
    # linuxserver.io WireGuard image, pinned to an exact release.
    image: lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls122
    restart: always
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [vpn-host]

    # --------------------------------------------------------------------------
    # Kernel permissions
    # --------------------------------------------------------------------------
    # NET_ADMIN: create the wg0 interface and manage iptables rules.
    cap_add:
      - NET_ADMIN
    # src_valid_mark: needed by wg-quick's policy routing (fwmark).
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

    # --------------------------------------------------------------------------
    # WireGuard configuration
    # --------------------------------------------------------------------------
    environment:
      # TZ: container time zone, from .env. Default: Etc/UTC.
      TZ: ${TZ:-Etc/UTC}
      # SERVERURL: endpoint written into client configs (public IP or domain).
      # No default: must be set in .env.
      SERVERURL: ${VPN_HOST}
      # SERVERPORT: port written into client configs. Default: 51820.
      SERVERPORT: ${VPN_PORT:-51820}
      # PEERS: comma-separated client names (or a count) to generate configs for.
      PEERS: ${VPN_PEERS}
      # INTERNAL_SUBNET: tunnel address range; server is .1. Default: 10.13.13.0.
      INTERNAL_SUBNET: ${VPN_SUBNET:-10.13.13.0}
      # ALLOWEDIPS: comma-separated CIDRs routed through the tunnel by clients.
      ALLOWEDIPS: ${VPN_ALLOWED_IPS}
      # PEERDNS: "auto" runs CoreDNS in the container (see config/coredns) and
      # points clients at it, so they resolve Docker service names.
      PEERDNS: auto
      # LOG_CONFS: "false" keeps client configs and QR codes out of the logs.
      LOG_CONFS: "false"

    # --------------------------------------------------------------------------
    # Network
    # --------------------------------------------------------------------------
    # VPN_DNS_IP: fixed address of this container on the internal network. Its
    # DNS server (CoreDNS, forwarding to Docker DNS) answers there, reachable
    # from containers on this server and, through the VPN client, on other
    # servers, which use it to resolve this server's service names.
    networks:
      default:
        ipv4_address: ${VPN_DNS_IP}

    # --------------------------------------------------------------------------
    # Published ports
    # --------------------------------------------------------------------------
    # Host UDP port VPN_PORT (default 51820) to WireGuard's port in the container.
    ports:
      - "${VPN_PORT:-51820}:51820/udp"

    # --------------------------------------------------------------------------
    # Persistent state
    # --------------------------------------------------------------------------
    # ./config holds server keys, generated client configs
    # (peer_<name>/peer_<name>.conf and .png QR code), the config templates and
    # the CoreDNS config. Generated files are secrets and are not committed.
    volumes:
      - ./config:/config
