services:
  vpn:
    image: lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls122
    restart: always
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      TZ: ${TZ:-Etc/UTC}
      SERVERURL: ${VPN_HOST}
      SERVERPORT: ${VPN_PORT:-51820}
      PEERS: ${VPN_PEERS}
      INTERNAL_SUBNET: ${VPN_SUBNET:-10.13.13.0}
      ALLOWEDIPS: ${VPN_ALLOWED_IPS}
      PEERDNS: auto
      LOG_CONFS: "false"
    ports:
      - "${VPN_PORT:-51820}:51820/udp"
    volumes:
      - ./config:/config
