services:
  netdata:
    image: netdata/netdata:v2.11.0
    hostname: ${MONITOR_NODE_NAME}
    restart: always
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      DO_NOT_TRACK: 1
      # databases (go.d/*.conf)
      MONITOR_MYSQL_USER: ${MONITOR_MYSQL_USER}
      MONITOR_MYSQL_PASSWORD: ${MONITOR_MYSQL_PASSWORD}
      MONITOR_POSTGRES_USER: ${MONITOR_POSTGRES_USER}
      MONITOR_POSTGRES_PASSWORD: ${MONITOR_POSTGRES_PASSWORD}
      # alerts (health_alarm_notify.conf + sendmail.sh)
      ALERT_EMAIL_ENABLED: ${ALERT_EMAIL_ENABLED:-NO}
      ALERT_EMAILS: ${ALERT_EMAILS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      ALERT_SLACK_ENABLED: ${ALERT_SLACK_ENABLED:-NO}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_CHANNEL: ${SLACK_CHANNEL}
    # No published ports: reachable only through the VPN (http://netdata:19999)
    volumes:
      # host and container metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # configuration (only what differs from the defaults)
      - ./config/go.d/mysql.conf:/etc/netdata/go.d/mysql.conf:ro
      - ./config/go.d/postgres.conf:/etc/netdata/go.d/postgres.conf:ro
      - ./config/go.d/httpcheck.conf:/etc/netdata/go.d/httpcheck.conf:ro
      - ./config/go.d/portcheck.conf:/etc/netdata/go.d/portcheck.conf:ro
      - ./config/go.d/sd/docker.conf:/etc/netdata/go.d/sd/docker.conf:ro
      - ./config/health_alarm_notify.conf:/etc/netdata/health_alarm_notify.conf:ro
      - ./config/sendmail.sh:/usr/local/bin/netdata-sendmail:ro
      # metrics history and state
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata

volumes:
  netdata-lib:
  netdata-cache:
