# Uptime checks for TCP services (databases, gateways).
# Netdata alerts when a port stops answering.
update_every: 30

jobs:
  - name: mysql-master
    host: mysql-db
    ports: [3306]

  - name: mysql-replica
    host: mysql-replica
    ports: [3306]

  - name: postgres-master
    host: postgres-db
    ports: [5432]

  - name: postgres-replica
    host: postgres-replica
    ports: [5432]

  - name: http-gateway
    host: http
    ports: [80, 443]
