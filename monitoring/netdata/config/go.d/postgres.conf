# PostgreSQL: connections, transactions, locks, WAL, replication lag.
# Comment out a job for a database that does not run on this server.
jobs:
  - name: postgres-master
    dsn: "postgres://${env:MONITOR_POSTGRES_USER}:${env:MONITOR_POSTGRES_PASSWORD}@postgres-db:5432/postgres"

  - name: postgres-replica
    dsn: "postgres://${env:MONITOR_POSTGRES_USER}:${env:MONITOR_POSTGRES_PASSWORD}@postgres-replica:5432/postgres"
