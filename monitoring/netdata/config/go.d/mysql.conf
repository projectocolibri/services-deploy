# MySQL / Percona Server: connections, queries, InnoDB, replication lag.
# Comment out a job for a database that does not run on this server.
jobs:
  - name: mysql-master
    dsn: "${env:MONITOR_MYSQL_USER}:${env:MONITOR_MYSQL_PASSWORD}@tcp(mysql-db:3306)/"

  - name: mysql-replica
    dsn: "${env:MONITOR_MYSQL_USER}:${env:MONITOR_MYSQL_PASSWORD}@tcp(mysql-replica:3306)/"
