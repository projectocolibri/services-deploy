sendmail="/usr/local/bin/netdata-sendmail"
EMAIL_SENDER="${SMTP_FROM}"
DEFAULT_RECIPIENT_EMAIL="${ALERT_EMAILS}"

# Slack
SEND_SLACK="${ALERT_SLACK_ENABLED}"
SLACK_WEBHOOK_URL="${SLACK_WEBHOOK_URL}"
DEFAULT_RECIPIENT_SLACK="${SLACK_CHANNEL}"
