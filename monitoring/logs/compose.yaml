services:
  dozzle:
    image: amir20/dozzle:v11.0.1
    restart: always
    command: ${DOZZLE_MODE:-}
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_REMOTE_AGENT: ${DOZZLE_REMOTE_AGENTS}
    networks:
      default:
        aliases:
          - dozzle-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
