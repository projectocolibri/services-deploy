# ============================================================================
# Monitoring stack
#
# Purpose:       Groups the monitoring and logging services.
# Role:          - pmm:    PMM Server: dashboards, metrics storage, Query
#                          Analytics and alerting
#                - client: PMM client and cAdvisor: registers this server,
#                          its containers and the databases in PMM
#                - logs:   Dozzle: live logs of every container
#                - portainer: Portainer: container management UI
#                All internal, reachable only through the VPN.
# Prerequisites: PMM_ADMIN_PASSWORD and PORTAINER_ADMIN_PASSWORD set in the
#                root .env for production.
# Variables:     From the root .env, section "Monitoring" (see .env.example for
#                the meaning and defaults of each variable).
# ============================================================================

include:
  # --------------------------------------------------------------------------
  # PMM Server
  # --------------------------------------------------------------------------
  - path: ./pmm/compose.yaml

  # --------------------------------------------------------------------------
  # PMM client and cAdvisor
  # --------------------------------------------------------------------------
  - path: ./client/compose.yaml

  # --------------------------------------------------------------------------
  # Container logs (Dozzle)
  # --------------------------------------------------------------------------
  - path: ./logs/compose.yaml

  # --------------------------------------------------------------------------
  # Container management (Portainer)
  # --------------------------------------------------------------------------
  - path: ./portainer/compose.yaml
