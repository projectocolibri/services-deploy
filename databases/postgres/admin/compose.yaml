services:
  postgres-admin:
    image: dpage/pgadmin4:9
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_HOSTS: ${ADMIN_HOSTS}
      ADMIN_HOSTS_LABELS: ${ADMIN_HOSTS_LABELS}
      ADMIN_HOSTS_USER: ${ADMIN_HOSTS_USER}
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    entrypoint: ["/bin/sh", "/usr/local/bin/pgadmin-entrypoint.sh"]
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-entrypoint.sh:/usr/local/bin/pgadmin-entrypoint.sh:ro

volumes:
  pgadmin-data:
