# ============================================================================
# PostgreSQL admin panel (pgAdmin 4)
#
# Purpose:       Web UI to browse and manage the PostgreSQL primary and
#                replica.
# Role:          Internal tool, reachable only through the VPN at
#                http://postgres-admin:<POSTGRES_ADMIN_PORT> (no published
#                ports). The server list is rebuilt from POSTGRES_ADMIN_HOSTS
#                on every start.
# Prerequisites: - VPN connection
#                - pgadmin-entrypoint.sh next to this file
# Variables:     POSTGRES_ADMIN_EMAIL, POSTGRES_ADMIN_PASSWORD,
#                POSTGRES_ADMIN_HOSTS, POSTGRES_ADMIN_HOSTS_LABELS,
#                POSTGRES_ADMIN_HOSTS_USER.
#                TZ from .env.
#                Storage (volume name or folder): POSTGRES_ADMIN_DATA_VOLUME.
# ============================================================================

services:
  postgres-admin:
    # --------------------------------------------------------------------------
    # Image and restart policy
    # --------------------------------------------------------------------------
    # No depends_on on the databases: sub-stacks can be removed from
    # ../compose.yaml, and depending on an undefined service is an error.
    image: dpage/pgadmin4:9
    restart: always
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [postgres-admin]

    # --------------------------------------------------------------------------
    # Login and server list
    # --------------------------------------------------------------------------
    environment:
      # TZ: container time zone, from .env.
      TZ: ${TZ}
      # PGADMIN_DEFAULT_EMAIL: initial administrator login (first start only).
      PGADMIN_DEFAULT_EMAIL: ${POSTGRES_ADMIN_EMAIL}
      # PGADMIN_DEFAULT_PASSWORD: initial administrator password (first start only).
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      # ADMIN_HOSTS: servers to register (comma separated), read by the entrypoint.
      ADMIN_HOSTS: ${POSTGRES_ADMIN_HOSTS}
      # ADMIN_HOSTS_LABELS: display names for ADMIN_HOSTS, same order.
      ADMIN_HOSTS_LABELS: ${POSTGRES_ADMIN_HOSTS_LABELS}
      # ADMIN_HOSTS_USER: role name pre-filled for every registered server.
      ADMIN_HOSTS_USER: ${POSTGRES_ADMIN_HOSTS_USER}
      # PGADMIN_SERVER_JSON_FILE: where the entrypoint writes the server list
      # and where pgAdmin imports it from.
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      # PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True" replaces the stored server
      # list with the file on every start, so POSTGRES_ADMIN_HOSTS changes apply.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      # PGADMIN_LISTEN_PORT: internal HTTP port, from .env.
      PGADMIN_LISTEN_PORT: ${POSTGRES_ADMIN_PORT}

    # --------------------------------------------------------------------------
    # Startup
    # --------------------------------------------------------------------------
    # Builds servers.json from POSTGRES_ADMIN_HOSTS, then runs the image entrypoint.
    entrypoint: ["/bin/sh", "/usr/local/bin/pgadmin-entrypoint.sh"]

    # --------------------------------------------------------------------------
    # Storage and scripts
    # --------------------------------------------------------------------------
    volumes:
      # pgAdmin's settings database (users, preferences, saved passwords).
      - ${POSTGRES_ADMIN_DATA_VOLUME:-pgadmin-data}:/var/lib/pgadmin
      # Custom entrypoint wrapper.
      - ./pgadmin-entrypoint.sh:/usr/local/bin/pgadmin-entrypoint.sh:ro

# ----------------------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------------------
# Used when the variable of a mount above (.env) is left at the volume's
# name; set it to a folder path to keep the data in that folder instead.
volumes:
  # pgAdmin data. Delete it to re-apply POSTGRES_ADMIN_EMAIL and POSTGRES_ADMIN_PASSWORD.
  pgadmin-data:
