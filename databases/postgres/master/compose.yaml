# ============================================================================
# PostgreSQL primary (Percona Distribution for PostgreSQL 17)
#
# Purpose:       Read/write PostgreSQL server that applications connect to.
# Role:          Source of streaming replication. The replica clones this
#                instance with pg_basebackup on its first start and then
#                streams its WAL. Reachable as postgres-primary.
# Prerequisites: - Credentials from .env
#                - postgres-master-entrypoint.sh and init-master.sh next to
#                  this file
#                WAL is archived into postgres-primary-backup once
#                postgres-backup-primary has created its pgBackRest stanza
#                there; until then (or without backups on this side) it is
#                not archived.
# Variables:     POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_REPLICATION_USER,
#                POSTGRES_REPLICATION_PASSWORD, POSTGRES_MONITOR_USER,
#                POSTGRES_MONITOR_PASSWORD, POSTGRES_APP_USER,
#                POSTGRES_APP_PASSWORD, POSTGRES_DATABASES.
#                TZ from .env.
#                Storage (volume name or folder):
#                POSTGRES_PRIMARY_DATA_VOLUME, POSTGRES_PRIMARY_BACKUP_VOLUME.
# ============================================================================

services:
  postgres-db:
    # --------------------------------------------------------------------------
    # Image and restart policy
    # --------------------------------------------------------------------------
    image: percona/percona-distribution-postgresql:17
    restart: always
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [postgres-primary]
    # tini as PID 1: forwards stop signals to PostgreSQL and reaps the
    # background database creation task of the entrypoint wrapper.
    init: true

    # --------------------------------------------------------------------------
    # Credentials
    # --------------------------------------------------------------------------
    # Read by the image entrypoint (POSTGRES_*) and by init-master.sh (the
    # rest). Applied only when the data volume is empty (first start). No
    # POSTGRES_DB: only the built-in "postgres" database is created.
    environment:
      # TZ: container time zone, from .env.
      # PostgreSQL's own timezone setting is fixed when the data directory is
      # initialized; changing TZ later does not change it.
      TZ: ${TZ}
      # POSTGRES_USER: superuser created at initialization.
      POSTGRES_USER: ${POSTGRES_USER}
      # POSTGRES_PASSWORD: password of POSTGRES_USER. Required.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # POSTGRES_INITDB_ARGS: UTF-8 encoding with byte-order sorting for every
      # database (the image's default is SQL_ASCII). Fixed when the data
      # directory is initialized.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      # REPLICATION_USER: replication role created by init-master.sh.
      REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      # REPLICATION_PASSWORD: password of REPLICATION_USER.
      REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      # MONITOR_USER: read-only PMM role created by init-master.sh.
      MONITOR_USER: ${POSTGRES_MONITOR_USER}
      # MONITOR_PASSWORD: password of MONITOR_USER.
      MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD}
      # APP_USER: application role created on every start if missing, granted
      # access to every database and allowed to create databases
      # (postgres-master-entrypoint.sh).
      APP_USER: ${POSTGRES_APP_USER}
      # APP_PASSWORD: password of APP_USER.
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      # DATABASES: databases created on every start if missing.
      DATABASES: ${POSTGRES_DATABASES}
      # pgBackRest settings of archive_command (PGBACKREST_<OPTION>): stanza,
      # data directory, zstd compression, logs to the server log only.
      PGBACKREST_STANZA: main
      PGBACKREST_PG1_PATH: /data/db
      PGBACKREST_COMPRESS_TYPE: zst
      PGBACKREST_LOG_LEVEL_FILE: "off"

    # --------------------------------------------------------------------------
    # Startup
    # --------------------------------------------------------------------------
    # Wrapper around the image entrypoint: promotes the data if it was a
    # replica (removes standby.signal), and creates APP_USER and the
    # databases in DATABASES on every start.
    entrypoint: ["/bin/bash", "/usr/local/bin/postgres-master-entrypoint.sh"]
    # Server settings (-c name=value):
    #   wal_level=replica          write enough WAL for streaming replication
    #   max_wal_senders=10         concurrent replication connections allowed
    #   wal_keep_size=1GB          WAL kept for a replica that was briefly
    #                              disconnected
    #   shared_preload_libraries   load pg_stat_monitor for PMM Query Analytics
    #   archive_mode=on            hand every completed WAL file to
    #                              archive_command
    #   archive_command            pgBackRest archive-push into the backup
    #                              volume, once postgres-backup-primary has
    #                              created the stanza (archive.info); before
    #                              that, or without backups on this server,
    #                              the WAL is not archived
    #   archive_timeout=60         switch to a new WAL file at least every
    #                              minute while there are writes, so the
    #                              archive (and the standby's) is never more
    #                              than about a minute behind
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=1GB
      - -c
      - shared_preload_libraries=pg_stat_monitor
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/pgbackrest/archive/main/archive.info || pgbackrest archive-push %p
      - -c
      - archive_timeout=60

    # --------------------------------------------------------------------------
    # Network
    # --------------------------------------------------------------------------
    # Applications and the replica connect to the role alias, not the service
    # name, so the primary can be moved or replaced without changing clients.
    networks:
      default:
        aliases:
          - postgres-primary

    # --------------------------------------------------------------------------
    # Storage and scripts
    # --------------------------------------------------------------------------
    volumes:
      # Database files (the image's PGDATA is /data/db).
      - ${POSTGRES_PRIMARY_DATA_VOLUME:-postgres-data}:/data/db
      # Socket directory, shared with the backup containers on this server.
      - postgres-socket:/run/postgresql
      # pgBackRest repository of postgres-backup-primary, written by
      # archive_command.
      - ${POSTGRES_PRIMARY_BACKUP_VOLUME:-postgres-primary-backup}:/var/lib/pgbackrest
      # Custom entrypoint wrapper.
      - ./postgres-master-entrypoint.sh:/usr/local/bin/postgres-master-entrypoint.sh:ro
      # Creates roles, the query analytics extension and the replication
      # pg_hba rule on first initialization.
      - ./init-master.sh:/docker-entrypoint-initdb.d/init-master.sh:ro

    # --------------------------------------------------------------------------
    # Health check
    # --------------------------------------------------------------------------
    # Healthy once the server accepts connections. $$ escapes the variable
    # from Compose so the container shell expands POSTGRES_USER.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

# ----------------------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------------------
# Used when the variable of a mount above (.env) is left at the volume's
# name; set it to a folder path to keep the data in that folder instead.
volumes:
  # Primary's data directory. Deleting it deletes every database.
  postgres-data:
  # Primary's socket directory (no data).
  postgres-socket:
  # Backups of the primary, declared in ../backup/compose.yaml.
  postgres-primary-backup:
