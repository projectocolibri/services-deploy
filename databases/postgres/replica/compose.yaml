services:
  postgres-replica:
    image: percona/percona-distribution-postgresql:17
    restart: always
    # No depends_on on the master: sub-stacks can be commented out in
    # ../compose.yaml. The entrypoint script waits for the master instead.
    # No POSTGRES_USER / POSTGRES_PASSWORD: the replica is cloned from the
    # master (same users) and never runs initdb.
    environment:
      MASTER_HOST: ${REPLICA_MASTER_HOST}
      REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    entrypoint: ["/bin/bash", "/usr/local/bin/replica-entrypoint.sh"]
    command:
      - postgres
      - -c
      - hot_standby=on
      - -c
      - summarize_wal=on
      - -c
      - shared_preload_libraries=pg_stat_monitor
    volumes:
      - postgres-replica-data:/data/db
      - ./replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres-replica-data:
