# ============================================================================
# MySQL admin panel (phpMyAdmin)
#
# Purpose:       Web UI to browse and manage the MySQL primary and replica.
# Role:          Internal tool, reachable only through the VPN at
#                http://mysql-admin:<MYSQL_ADMIN_PORT> (no published ports).
#                Users log in with MySQL credentials.
# Prerequisites: - VPN connection
#                - The MySQL servers listed in MYSQL_ADMIN_HOSTS running
# Variables:     MYSQL_ADMIN_HOSTS, MYSQL_ADMIN_HOSTS_LABELS,
#                MYSQL_ADMIN_UPLOAD_LIMIT.
#                TZ from .env.
# ============================================================================

services:
  mysql-admin:
    # --------------------------------------------------------------------------
    # Image and restart policy
    # --------------------------------------------------------------------------
    # No depends_on on the databases: sub-stacks can be removed from
    # ../compose.yaml, and depending on an undefined service is an error.
    image: phpmyadmin:5.2
    restart: always
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [mysql-admin]

    # --------------------------------------------------------------------------
    # Server list and limits
    # --------------------------------------------------------------------------
    environment:
      # TZ: container time zone, from .env.
      TZ: ${TZ}
      # PMA_HOSTS: servers offered on the login screen (comma separated).
      PMA_HOSTS: ${MYSQL_ADMIN_HOSTS}
      # PMA_VERBOSES: display names for PMA_HOSTS, same order (comma separated).
      PMA_VERBOSES: ${MYSQL_ADMIN_HOSTS_LABELS}
      # UPLOAD_LIMIT: maximum import file size.
      UPLOAD_LIMIT: ${MYSQL_ADMIN_UPLOAD_LIMIT}
      # APACHE_PORT: internal HTTP port, from .env.
      APACHE_PORT: ${MYSQL_ADMIN_PORT}
