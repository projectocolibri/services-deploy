# ============================================================================
# MySQL stack
#
# Purpose:       Groups the MySQL (Percona Server) services.
# Role:          - master:  read/write primary, alias mysql-primary
#                - replica: read-only copy, alias mysql-replica
#                - admin:   phpMyAdmin web panel, reached through the VPN
#                The primary and replica are separate services with separate
#                volumes; the replica clones the primary on its first start.
# Prerequisites: - databases/mysql/.env must exist (may be empty)
#                - Production passwords set in databases/mysql/.env
# Variables:     Loaded from the env files below. See databases/mysql/.env.dev
#                for the meaning and defaults of each variable.
# ============================================================================

include:
  # --------------------------------------------------------------------------
  # Primary (read/write)
  # --------------------------------------------------------------------------
  # Env files are layered in order; a key in ./.env overrides ./.env.dev.
  - path: ./master/compose.yaml
    env_file:
      # Committed development defaults.
      - ./.env.dev
      # Local, uncommitted overrides and secrets.
      - ./.env

  # --------------------------------------------------------------------------
  # Replica (read-only)
  # --------------------------------------------------------------------------
  - path: ./replica/compose.yaml
    env_file:
      # Committed development defaults.
      - ./.env.dev
      # Local, uncommitted overrides and secrets.
      - ./.env

  # --------------------------------------------------------------------------
  # Admin panel (phpMyAdmin)
  # --------------------------------------------------------------------------
  - path: ./admin/compose.yaml
    env_file:
      # Committed development defaults.
      - ./.env.dev
      # Local, uncommitted overrides and secrets.
      - ./.env
