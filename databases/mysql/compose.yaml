# ============================================================================
# MySQL stack
#
# Purpose:       Groups the MySQL (Percona Server) services.
# Role:          - master:  read/write primary, alias mysql-primary
#                - replica: read-only copy, alias mysql-replica
#                - admin:   phpMyAdmin web panel, reached through the VPN
#                - backup:  XtraBackup full and incremental backups and
#                           binary log copies of the primary, the replica or
#                           both, each on its own server
#                The primary and replica are separate services with separate
#                volumes; the replica clones the primary on its first start.
# Prerequisites: Production passwords set in the root .env.
# Variables:     From the root .env, section "MySQL" (see .env.example for
#                the meaning and defaults of each variable).
# ============================================================================

include:
  # --------------------------------------------------------------------------
  # Primary (read/write)
  # --------------------------------------------------------------------------
  - path: ./master/compose.yaml

  # --------------------------------------------------------------------------
  # Replica (read-only)
  # --------------------------------------------------------------------------
  - path: ./replica/compose.yaml

  # --------------------------------------------------------------------------
  # Admin panel (phpMyAdmin)
  # --------------------------------------------------------------------------
  - path: ./admin/compose.yaml

  # --------------------------------------------------------------------------
  # Backups (XtraBackup + binary log streaming)
  # --------------------------------------------------------------------------
  # Profiles mysql-backup-primary and mysql-backup-replica.
  - path: ./backup/compose.yaml
