services:
  percona-mysql-backup:
    image: percona/percona-xtrabackup:8.0
    restart: always
    user: root
    # No depends_on on the databases: sub-stacks can be commented out in
    # ../compose.yaml, and depending on an undefined service is an error.
    # The scheduler script waits for BACKUP_HOST instead.
    environment:
      BACKUP_HOST: ${BACKUP_HOST}
      BACKUP_HOST_USER: ${BACKUP_HOST_USER}
      BACKUP_HOST_PASSWORD: ${BACKUP_HOST_PASSWORD}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-4h}
    volumes:
      # xtrabackup copies the data files: datadir of BACKUP_HOST
      # (must be one of the volumes declared below)
      - ${BACKUP_HOST_VOLUME}:/var/lib/mysql
      - ${PERCONA_MYSQL_BACKUP_FOLDER}:/backups
      - ./mysql-backup-scheduler.sh:/usr/local/bin/mysql-backup-scheduler.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/mysql-backup-scheduler.sh"]

# Every volume BACKUP_HOST_VOLUME may point to must be declared here by name:
# Compose does not substitute variables in these keys.
volumes:
  mysql-data:
  mysql-replica-data:
