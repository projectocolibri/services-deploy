# ============================================================================
# MySQL backups (Percona XtraBackup)
#
# Purpose:       Full and incremental physical backups plus continuous copies
#                of the binary logs, for full and point-in-time recovery,
#                taken on the primary's server, the replica's server, or both.
# Role:          - mysql-backup-primary (profile mysql-backup-primary): backs
#                  up the local primary into the volume mysql-primary-backup
#                  on the primary's server
#                - mysql-backup-replica (profile mysql-backup-replica): backs
#                  up the local replica into the volume mysql-replica-backup
#                  on the replica's server, so the primary is not loaded. The
#                  replica's own binary logs hold every replicated
#                  transaction, with the primary's GTIDs.
#                Each container (backup.sh) backs up only its local
#                server, so each enabled side keeps its own, independent
#                backups:
#                  - in the background: streams the server's binary logs
#                  - on FULL_SCHEDULE / INCREMENTAL_SCHEDULE (supercronic):
#                    XtraBackup full or incremental backups (page tracking),
#                    verified, with retention
# Prerequisites: - The server being backed up running on this server
#                  (../master or ../replica): its data volume is read by
#                  XtraBackup
#                - Disk for the backups in Docker's volume directory
# Variables:     MYSQL_ROOT_PASSWORD, MYSQL_BACKUP_FULL_SCHEDULE,
#                MYSQL_BACKUP_INCREMENTAL_SCHEDULE, MYSQL_BACKUP_RETENTION_DAYS,
#                MYSQL_BACKUP_VERIFY, MYSQL_BACKUP_THREADS. TZ from .env.
#                Storage (volume name or folder): MYSQL_PRIMARY_DATA_VOLUME,
#                MYSQL_REPLICA_DATA_VOLUME, MYSQL_PRIMARY_BACKUP_VOLUME,
#                MYSQL_REPLICA_BACKUP_VOLUME.
# ============================================================================

# ----------------------------------------------------------------------------
# Shared settings of both backup containers
# ----------------------------------------------------------------------------
x-mysql-backup: &mysql-backup
  # --------------------------------------------------------------------------
  # Image and restart policy
  # --------------------------------------------------------------------------
  # XtraBackup plus supercronic (./Dockerfile). Runs as root to read the
  # server's data files and write the backups.
  build:
    context: .
  restart: always
  user: root

  # --------------------------------------------------------------------------
  # Startup
  # --------------------------------------------------------------------------
  entrypoint: ["/bin/bash", "/usr/local/bin/backup.sh"]

  # --------------------------------------------------------------------------
  # Health check
  # --------------------------------------------------------------------------
  # Healthy while the binary log stream runs, once a backup exists and while
  # the last backup did not fail.
  healthcheck:
    test: ["CMD", "/bin/bash", "/usr/local/bin/backup.sh", "health"]
    interval: 1m
    timeout: 10s
    retries: 3
    start_period: 1h

# ----------------------------------------------------------------------------
# Shared backup settings
# ----------------------------------------------------------------------------
x-mysql-backup-environment: &mysql-backup-environment
  # TZ: container time zone. The XtraBackup image has no time zone data, so
  # the schedules and logs are always in UTC.
  TZ: ${TZ}
  # MYSQL_ROOT_PASSWORD: root password of the server backed up.
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  # FULL_SCHEDULE / INCREMENTAL_SCHEDULE: cron expressions of the full and
  # incremental backups.
  FULL_SCHEDULE: ${MYSQL_BACKUP_FULL_SCHEDULE}
  INCREMENTAL_SCHEDULE: ${MYSQL_BACKUP_INCREMENTAL_SCHEDULE}
  # RETENTION_DAYS: any moment of the last RETENTION_DAYS days stays
  # restorable.
  RETENTION_DAYS: ${MYSQL_BACKUP_RETENTION_DAYS}
  # BACKUP_VERIFY: "true" prepares a copy of every backup (with the backups
  # it depends on), like a restore.
  BACKUP_VERIFY: ${MYSQL_BACKUP_VERIFY}
  # BACKUP_THREADS: parallel copy and compression threads.
  BACKUP_THREADS: ${MYSQL_BACKUP_THREADS}

services:
  # ==========================================================================
  # Backups of the primary (on the primary's server)
  # ==========================================================================
  mysql-backup-primary:
    <<: *mysql-backup
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [mysql-backup-primary]
    environment:
      <<: *mysql-backup-environment
      # BACKUP_SOURCE_HOST: server backed up (the local primary).
      BACKUP_SOURCE_HOST: mysql-primary
      # BACKUP_SOURCE_ROLE: primary, so backups start at once.
      BACKUP_SOURCE_ROLE: primary
      # BINLOG_SERVER_ID: server ID of the binary log stream on the primary;
      # differs from the servers (1, 2) and from the replica side's stream.
      BINLOG_SERVER_ID: 101
    volumes:
      # Primary's data directory, read-only: the backup never changes it.
      - ${MYSQL_PRIMARY_DATA_VOLUME:-mysql-data}:/var/lib/mysql:ro
      # Backups (chains/) and binary logs (binlog/). Operation logs are sent
      # to the container output, not stored in this volume.
      - ${MYSQL_PRIMARY_BACKUP_VOLUME:-mysql-primary-backup}:/backups
      # Startup, backup, schedule and health check script.
      - ./backup.sh:/usr/local/bin/backup.sh:ro

  # ==========================================================================
  # Backups of the replica (on the replica's server)
  # ==========================================================================
  mysql-backup-replica:
    <<: *mysql-backup
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [mysql-backup-replica]
    environment:
      <<: *mysql-backup-environment
      # BACKUP_SOURCE_HOST: server backed up (the local replica).
      BACKUP_SOURCE_HOST: mysql-replica
      # BACKUP_SOURCE_ROLE: replica, so backups wait until it has cloned the
      # primary and replicates.
      BACKUP_SOURCE_ROLE: replica
      # BINLOG_SERVER_ID: server ID of the binary log stream on the replica;
      # differs from the servers (1, 2) and from the primary side's stream.
      BINLOG_SERVER_ID: 102
    volumes:
      # Replica's data directory, read-only: the backup never changes it.
      - ${MYSQL_REPLICA_DATA_VOLUME:-mysql-replica-data}:/var/lib/mysql:ro
      # Backups (chains/) and binary logs (binlog/). Operation logs are sent
      # to the container output, not stored in this volume.
      - ${MYSQL_REPLICA_BACKUP_VOLUME:-mysql-replica-backup}:/backups
      # Startup, backup, schedule and health check script.
      - ./backup.sh:/usr/local/bin/backup.sh:ro

# ----------------------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------------------
# Used when the variable of a mount above (.env) is left at the volume's
# name; set it to a folder path to keep the data in that folder instead.
volumes:
  # Servers' data volumes, declared in ../master and ../replica.
  mysql-data:
  mysql-replica-data:
  # Backups and binary logs. Deleting one deletes its backups.
  mysql-primary-backup:
  mysql-replica-backup:
