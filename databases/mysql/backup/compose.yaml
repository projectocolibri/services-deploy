# ============================================================================
# MySQL backups
#
# Purpose:       Daily physical backups of the MySQL replica plus continuous
#                copies of the primary's binary logs, for full and
#                point-in-time recovery.
# Role:          Runs on the server with the replica (which can be another
#                server than the primary, connected through the VPN client).
#                One container, mysql-backup.sh:
#                  - in the background: streams the primary's binary logs
#                  - in the foreground: Percona XtraBackup of the local
#                    replica, verified, with retention
#                Backups are written to MYSQL_BACKUP_DIR on this server.
# Prerequisites: - The replica (../replica) running on this server: its data
#                  volume is read by XtraBackup
#                - The primary reachable as mysql-primary (same server, or
#                  through the VPN client and VPN_DNS_IP)
#                - Enough disk in MYSQL_BACKUP_DIR for about
#                  MYSQL_BACKUP_RETENTION_DAYS + 1 compressed backups plus the
#                  binary logs; ideally a separate disk
# Variables:     MYSQL_ROOT_PASSWORD, MYSQL_REPLICATION_USER,
#                MYSQL_REPLICATION_PASSWORD, MYSQL_REPLICA_PRIMARY_HOST,
#                MYSQL_BACKUP_DIR, MYSQL_BACKUP_TIME,
#                MYSQL_BACKUP_RETENTION_DAYS, MYSQL_BACKUP_VERIFY,
#                MYSQL_BACKUP_THREADS, MYSQL_BINLOG_SERVER_ID.
#                TZ and VPN_DNS_IP from .env.
# ============================================================================

services:
  mysql-backup:
    # --------------------------------------------------------------------------
    # Image and restart policy
    # --------------------------------------------------------------------------
    # XtraBackup major version must match the server's (8.4); the image also
    # has mysqlbinlog and the mysql client. Runs as root to read the replica's
    # data files and write the backups.
    image: percona/percona-xtrabackup:8.4
    restart: always
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [mysql-backup]
    user: root

    # --------------------------------------------------------------------------
    # Backup and stream settings
    # --------------------------------------------------------------------------
    environment:
      # TZ: container time zone. Default: Etc/UTC. The XtraBackup image has no
      # time zone data, so BACKUP_TIME and logs are always in UTC.
      TZ: ${TZ:-Etc/UTC}
      # BACKUP_SOURCE_HOST: replica to back up (on this server), also asked
      # where the primary's binary log is.
      BACKUP_SOURCE_HOST: mysql-replica
      # MYSQL_ROOT_PASSWORD: root password of the replica.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # BACKUP_TIME: daily start time, HH:MM. Default: 02:00.
      BACKUP_TIME: ${MYSQL_BACKUP_TIME:-02:00}
      # BACKUP_RETENTION_DAYS: days to keep backups. Default: 7.
      BACKUP_RETENTION_DAYS: ${MYSQL_BACKUP_RETENTION_DAYS:-7}
      # BACKUP_VERIFY: "true" decompresses and prepares a copy of every backup.
      BACKUP_VERIFY: ${MYSQL_BACKUP_VERIFY:-true}
      # BACKUP_THREADS: parallel copy and compression threads. Default: 2.
      BACKUP_THREADS: ${MYSQL_BACKUP_THREADS:-2}
      # PRIMARY_HOST: primary to stream binary logs from. Default: mysql-primary.
      PRIMARY_HOST: ${MYSQL_REPLICA_PRIMARY_HOST:-mysql-primary}
      # REPLICATION_USER: replication account on the primary.
      REPLICATION_USER: ${MYSQL_REPLICATION_USER}
      # REPLICATION_PASSWORD: password of REPLICATION_USER.
      REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
      # BINLOG_SERVER_ID: server ID the stream uses on the primary; unique
      # among all servers and streams. Default: 101.
      BINLOG_SERVER_ID: ${MYSQL_BINLOG_SERVER_ID:-101}

    # --------------------------------------------------------------------------
    # Startup
    # --------------------------------------------------------------------------
    entrypoint: ["/bin/bash", "/usr/local/bin/mysql-backup.sh"]

    # --------------------------------------------------------------------------
    # Network
    # --------------------------------------------------------------------------
    # VPN_DNS_IP: resolves mysql-primary when the primary runs on another server.
    dns:
      - ${VPN_DNS_IP}

    # --------------------------------------------------------------------------
    # Data, backups and scripts
    # --------------------------------------------------------------------------
    volumes:
      # Replica's data directory (same path as in the replica container),
      # read-only: the backup can never modify the replica's data.
      - mysql-replica-data:/var/lib/mysql:ro
      # Backup destination on this server: MYSQL_BACKUP_DIR (.env), with full/
      # and binlog/ inside. Relative paths are relative to this directory.
      # Default: ./backups/mysql.
      - ${MYSQL_BACKUP_DIR:-./backups/mysql}:/backups
      # Backup and stream script.
      - ./mysql-backup.sh:/usr/local/bin/mysql-backup.sh:ro

    # --------------------------------------------------------------------------
    # Health check
    # --------------------------------------------------------------------------
    # Healthy while the binary log stream runs and a backup is running or the
    # newest backup is under 26 hours old.
    healthcheck:
      test: ["CMD", "/bin/bash", "/usr/local/bin/mysql-backup.sh", "health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1h

# ----------------------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------------------
volumes:
  # The replica's data volume, declared in ../replica/compose.yaml.
  mysql-replica-data:
