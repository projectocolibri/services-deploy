services:
  mysql-db:
    image: percona/percona-server:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
      REPLICATION_USER: ${MYSQL_REPLICATION_USER}
      REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
      MONITOR_USER: ${MYSQL_MONITOR_USER}
      MONITOR_PASSWORD: ${MYSQL_MONITOR_PASSWORD}
    # server-id/log-bin/gtid: GTID replication
    # mysql_clone: lets the replica clone this instance on its first start
    command:
      - --server-id=${MASTER_SERVER_ID}
      - --log-bin=${MYSQL_LOG_BIN}
      - --binlog-format=${MYSQL_BINLOG_FORMAT}
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --plugin-load-add=mysql_clone.so
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-master.sh:/docker-entrypoint-initdb.d/init-master.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mysql-data:
