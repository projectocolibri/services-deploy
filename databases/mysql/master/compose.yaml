# ============================================================================
# MySQL primary (Percona Server 8.4)
#
# Purpose:       Read/write MySQL server that applications connect to.
# Role:          Source of GTID-based replication. The replica clones this
#                instance with the clone plugin on its first start and then
#                follows its binary log. Reachable as mysql-primary.
# Prerequisites: - Credentials from .env
#                - entrypoint.sh and init.sh next to this
#                  file
# Variables:     MYSQL_ROOT_PASSWORD, MYSQL_USER, MYSQL_USER_PASSWORD,
#                MYSQL_REPLICATION_USER, MYSQL_REPLICATION_PASSWORD,
#                MYSQL_MONITOR_USER, MYSQL_MONITOR_PASSWORD, MYSQL_DATABASES.
#                TZ from .env.
#                Storage (volume name or folder): MYSQL_PRIMARY_DATA_VOLUME.
# ============================================================================

services:
  mysql-db:
    # --------------------------------------------------------------------------
    # Image and restart policy
    # --------------------------------------------------------------------------
    image: percona/percona-server:8.4
    restart: always
    # Runs when COMPOSE_PROFILES (.env) includes this profile.
    profiles: [mysql-primary]

    # --------------------------------------------------------------------------
    # Credentials
    # --------------------------------------------------------------------------
    # Read by the image entrypoint (MYSQL_*) and by init.sh (the rest).
    # Applied only when the data volume is empty (first start).
    environment:
      # TZ: container and MySQL system time zone, from .env.
      TZ: ${TZ}
      # MYSQL_ROOT_PASSWORD: root account password. Required.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # MYSQL_USER: application user created at initialization.
      MYSQL_USER: ${MYSQL_USER}
      # MYSQL_PASSWORD: password of MYSQL_USER.
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
      # REPLICATION_USER: account created for the replica by init.sh.
      REPLICATION_USER: ${MYSQL_REPLICATION_USER}
      # REPLICATION_PASSWORD: password of REPLICATION_USER.
      REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
      # MONITOR_USER: read-only PMM account created by init.sh.
      MONITOR_USER: ${MYSQL_MONITOR_USER}
      # MONITOR_PASSWORD: password of MONITOR_USER.
      MONITOR_PASSWORD: ${MYSQL_MONITOR_PASSWORD}
      # DATABASES: databases created on every start if missing. MYSQL_USER gets
      # privileges only on these databases and any configured patterns
      # (entrypoint.sh).
      DATABASES: ${MYSQL_DATABASES}

    # --------------------------------------------------------------------------
    # Startup
    # --------------------------------------------------------------------------
    # Wrapper around the image entrypoint: sets server_id, removes old
    # replication settings if this data was a promoted replica, and creates
    # the databases in DATABASES on every start.
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint.sh"]
    # mysqld options:
    #   --log-bin                   write the binary log the replica reads
    #   --gtid-mode, --enforce-...  GTID replication (auto-positioning)
    #   --plugin-load-add           clone plugin, lets the replica copy this
    #                               instance on its first start
    #   --read-only=OFF             accept writes
    #   --lower-case-table-names=1  database and table names stored in
    #                               lowercase and matched case-insensitively
    #                               (MyApp -> myapp). Fixed when the data
    #                               volume is initialized: changing it needs a
    #                               new volume. Must match the replica
    command:
      - mysqld
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --plugin-load-add=mysql_clone.so
      - --read-only=OFF
      - --lower-case-table-names=1

    # --------------------------------------------------------------------------
    # Network
    # --------------------------------------------------------------------------
    # Applications and the replica connect to the role alias, not the service
    # name, so the primary can be moved or replaced without changing clients.
    networks:
      default:
        aliases:
          - mysql-primary

    # --------------------------------------------------------------------------
    # Storage and scripts
    # --------------------------------------------------------------------------
    volumes:
      # Database files.
      - ${MYSQL_PRIMARY_DATA_VOLUME:-mysql-data}:/var/lib/mysql
      # Custom entrypoint wrapper.
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      # Creates the replication and monitoring users on first initialization.
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro

    # --------------------------------------------------------------------------
    # Health check
    # --------------------------------------------------------------------------
    # Healthy once mysqld answers a ping as root. $$ escapes the variable from
    # Compose so the container shell expands MYSQL_ROOT_PASSWORD.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

# ----------------------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------------------
# Used when the variable of a mount above (.env) is left at the volume's
# name; set it to a folder path to keep the data in that folder instead.
volumes:
  # Primary's data directory. Deleting it deletes every database.
  mysql-data:
