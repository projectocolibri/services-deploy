services:
  mysql-db:
    image: percona/percona-server:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
      REPLICATION_USER: ${MYSQL_REPLICATION_USER}
      REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
      MONITOR_USER: ${MYSQL_MONITOR_USER}
      MONITOR_PASSWORD: ${MYSQL_MONITOR_PASSWORD}
    entrypoint: ["/bin/bash", "/usr/local/bin/mysql-master-entrypoint.sh"]
    command:
      - mysqld
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --plugin-load-add=mysql_clone.so
      - --read-only=OFF
    networks:
      default:
        aliases:
          - mysql-primary
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-master-entrypoint.sh:/usr/local/bin/mysql-master-entrypoint.sh:ro
      - ./init-master.sh:/docker-entrypoint-initdb.d/init-master.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mysql-data:
